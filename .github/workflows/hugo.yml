name: 构建并部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 硬门禁：扫不过就不构建、不部署。失败模式是「新内容不出现」，不是「站点坏掉」，
  # 因为 Pages 继续服务上一次成功部署的产物。
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 扫描敏感信息
        env:
          # 客户名 / 项目代号词库，英文逗号分隔。
          # 只放在仓库 Settings → Secrets and variables → Actions 里，
          # 绝不写进本文件——否则护栏自己就成了客户名单泄漏源。
          GUARD_KEYWORDS: ${{ secrets.GUARD_KEYWORDS }}
        run: bash .github/scripts/guard.sh

  build:
    needs: guard
    runs-on: ubuntu-latest
    env:
      # 版本锁死：不跟随最新版，避免某天 Hugo 升级把站点搞坏
      HUGO_VERSION: 0.152.2
    steps:
      - name: 安装 Hugo
        run: |
          wget -q -O /tmp/hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i /tmp/hugo.deb
          hugo version

      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 读取 Pages 配置
        id: pages
        uses: actions/configure-pages@v5

      - name: 构建
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
