name: Guard 敏感信息扫描

# 只扫「会被公开发布的内容」，不扫 README / 模板 / 脚本本身（它们必然含有规则示例）。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: 扫描 content/posts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 运行扫描
        env:
          # 客户名 / 项目代号 / 内部术语词库，英文逗号分隔。
          # 放在仓库 Settings → Secrets and variables → Actions 里，
          # 绝不写进本文件——否则 guard 自己就成了客户名单泄漏源。
          GUARD_KEYWORDS: ${{ secrets.GUARD_KEYWORDS }}
        run: bash .github/scripts/guard.sh
